name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      # Artifact quota is shared across the account. A full quota must not turn
      # a successful compile/test run red; release APKs are also published as
      # durable GitHub Release assets below.
      - name: Upload debug APK (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: eve-game-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not set — cannot sign the release." >&2
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eve-release.keystore"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test and build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/eve-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Verify release signer
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          expected="2fe09f50180d92e3b3204992ffc9a8c598087b9a7bac0b12d3f23a1e3687fd7f"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected signing certificate: $actual" >&2
            exit 1
          fi

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "eve-game-tracker-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ github.ref_name }}" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            "eve-game-tracker-${{ github.ref_name }}.apk" \
            --title "Eve Game Tracker ${{ github.ref_name }}" \
            --generate-notes \
            $prerelease

      - name: Upload release APK artifact (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: eve-game-tracker-${{ github.ref_name }}
          path: eve-game-tracker-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 1
